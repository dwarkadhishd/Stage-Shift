<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage & Shift</title>
    <!-- Note: Changed to the stable 5.3.3 Bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <style>
        .white-black {
            filter: invert(1);
            /* Better way to make SVGs white if they are black */
        }

        /* Custom styles for the Front Stage Image */
        .front-stage-image {
            width: 100%;
            height: 55vh;
            /* Limits height to 55% of the screen height */
            min-height: 400px;
            /* Ensures it doesn't get too small on phones */
            object-fit: cover;
            /* Prevents the image from stretching/distorting */
            filter: brightness(0.4);
            /* Darkens the image slightly so white text is readable */
        }

        /* Perfectly center the text inside the carousel */
        .caption-of-front-stage-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            bottom: auto;
            /* Removes default Bootstrap bottom positioning */
            text-align: center;
            width: 100%;
        }

        /* Make the heading look cooler and minimalist */
        .caption-of-front-stage-image h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .caption-of-front-stage-image p {
            font-size: 1.25rem;
            font-weight: 300;
        }
    </style>
</head>

<body>
    <!-- Header and login button -->
    <header>
        <div class="px-3 py-2 text-bg-dark border-bottom">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <h2 class="mb-0 me-4">Stage
                        <img class="white-black" src="./assets/stopwatch.svg" alt="stopwatch" width="20px"
                            height="20px" />
                        <img class="white-black" src="./assets/mic-fill.svg" alt="mic-fill" width="20px"
                            height="20px" /> & Shift
                    </h2>

                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small">
                        <li>
                            <a href="#" class="nav-link text-white"> Home </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link text-secondary"> Explore </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link text-secondary"> Volunteer </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="px-3 py-2 border-bottom mb-0"> <!-- Removed mb-3 to make it flush with image -->
            <div class="container d-flex flex-wrap justify-content-center">
                <form class="col-12 col-lg-auto mb-2 mb-lg-0 me-lg-auto" role="search">
                    <input type="search" class="form-control rounded-pill" placeholder="Search..." aria-label="Search">
                </form>
                <div class="text-end">
                    <button type="button" class="btn btn-light text-dark me-2 rounded-pill">Login</button>
                    <button type="button" class="btn btn-primary rounded-pill">Sign-up</button>
                </div>
            </div>
        </div>
    </header>

    <!-- front image / Hero Section -->
    <div id="carouselExampleCaptions" class="carousel slide position-relative">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <!-- Ensure you have a placeholder image here if your local image isn't loading -->
                <img src="./assets/Stage-Img.jpg" class="front-stage-image d-block" alt="Stage Image">

                <!-- Notice we removed d-none d-md-block so it stays visible on mobile -->
                <div class="caption-of-front-stage-image text-light px-3">
                    <h1>Find Your Stage. Own Your Shift.</h1>
                    <p>Connecting performers with crews and opportunities.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Script file -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
